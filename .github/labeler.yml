# Labeler configuration for automatic PR labeling

# Rust files
rust:
  - changed-files:
      - any-glob-to-any-file:
          - rdnsx/**/*.rs
          - rdnsx-core/**/*.rs

# Documentation
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**/*
          - README.md
          - CHANGELOG.md
          - CONTRIBUTING.md
          - INSTALL.md
          - docker/DOCKER_README.md

# CI/CD
ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**/*
          - .github/dependabot.yml
          - .github/labeler.yml
          - docker/Dockerfile
          - docker/docker-compose.yml
          - scripts/build-docker.sh

# Dependencies
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - Cargo.toml
          - Cargo.lock
          - rdnsx/Cargo.toml
          - rdnsx-core/Cargo.toml
          - docs/Gemfile*

# Testing
testing:
  - changed-files:
      - any-glob-to-any-file:
          - rdnsx-core/tests/**/*
          - test_*.rs
          - test_*.txt

# Configuration
config:
  - changed-files:
      - any-glob-to-any-file:
          - config/rdnsx.toml
          - config/resolvers.txt
          - .gitignore

# Security
security:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/security.yml
          - SECURITY.md

# Performance
performance:
  - changed-files:
      - any-glob-to-any-file:
          - rdnsx-core/benches/**/*
          - rdnsx-core/src/resolver.rs
          - rdnsx-core/src/client.rs

# Labels from the branch name
bug:
  - head-branch: ['^fix', '^bug', '^hotfix']

enhancement:
  - head-branch: ['^feat', '^feature']

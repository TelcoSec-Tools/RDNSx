[package]
name = "rdnsx-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Core DNS toolkit library for fast and efficient DNS resolution"

[features]
default = []
# Database exporters (each pulls in a full database driver)
elasticsearch = ["dep:elasticsearch"]
mongodb = ["dep:mongodb"]
cassandra = ["dep:scylla"]
all-exporters = ["elasticsearch", "mongodb", "cassandra"]

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
hickory-resolver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
ipnetwork = { workspace = true }
chrono = { workspace = true }
elasticsearch = { workspace = true, optional = true }
mongodb = { workspace = true, optional = true }
scylla = { workspace = true, optional = true }
async-trait = "0.1"
hex = "0.4"
rand = "0.10"
toml = "1.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1.35", features = ["rt", "macros"] }
hickory-resolver = { workspace = true }
[[bench]]
name = "dns_benchmarks"
harness = false

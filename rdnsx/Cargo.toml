[package]
name = "rdnsx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Fast and multi-purpose DNS toolkit - CLI"
default-run = "rdnsx"

[[bin]]
name = "rdnsx"
path = "src/main.rs"

[features]
default = ["export-elasticsearch", "export-mongodb", "export-cassandra"]
export-elasticsearch = ["rdnsx-core/elasticsearch"]
export-mongodb = ["rdnsx-core/mongodb"]
export-cassandra = ["rdnsx-core/cassandra"]

[dependencies]
# Core library
rdnsx-core = { path = "../rdnsx-core", version = "0.1.0" }

# Workspace dependencies
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = "0.3"
